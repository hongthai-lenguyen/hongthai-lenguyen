name: Advanced Private Telemetry Extraction
on:
  schedule:
    # Optimized execution at 22:30 UTC (05:30 Ho Chi Minh City time).
    # Bypasses the massive midnight UTC server gridlock on GitHub Actions.
    - cron: "30 22 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

# Prevents race conditions if multiple pushes occur rapidly during active development
concurrency:
  group: metrics-update
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for pushing the SVG back to the repo
    steps:
      - name: Generate Comprehensive Data Science Telemetry
        uses: lowlighter/metrics@latest
        with:
          # 1. Core Authentication & Display Setup
          token: ${{ secrets.README_TOKEN }}
          config_timezone: Asia/Ho_Chi_Minh
          base: header, activity, community, repositories, metadata
          base_indepth: yes 
          
          # 2. Private Contribution Aggregation Protocol
          commits_authoring: "hongthai-lenguyen, hongthai.lenguyen@outlook.com" 
          
          # 3. Deep Language Extraction (Including Private Codebases)
          plugin_languages: yes
          plugin_languages_indepth: yes 
          plugin_languages_analysis_timeout: 60 # Increased to 60s for massive scRNA-seq/metabolomics repositories
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_categories: markup, programming, data
          # CRITICAL FIX: GitHub Linguist recognizes "Jupyter Notebook", not "jupyter notebook".
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot, Jupyter Notebook, rmd
          plugin_languages_limit: 8 
          
          # 4. Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year 

          # 5. [NEW] Algorithmic Code Volume Tracking
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # 6. [NEW] Computational Habits & Temporal Analysis
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes